<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111418" />
    <title>FlowBlocks 离线</title>
    <style>
      :root {
        color: #feffff;
        background: #111418;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(71, 112, 155, 0.26), transparent 34%),
          radial-gradient(circle at bottom right, rgba(175, 200, 218, 0.12), transparent 36%),
          #111418;
      }

      main {
        width: min(100% - 40px, 390px);
        padding: 28px;
        background: rgba(28, 33, 40, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 32px;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.26);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 34px;
      }

      p {
        margin: 12px 0 0;
        color: rgba(254, 255, 255, 0.72);
        font-size: 14px;
        line-height: 21px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>你已经离线了</h1>
      <p>如果你之前打开过 FlowBlocks，回到主屏幕再次打开通常可以继续使用缓存版本。</p>
    </main>
  </body>
</html>
